[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "offline-companion-core"
version = "1.0.0"
description = "Privacy-first local companion agent core (Windows-first, GGUF, SQLite)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-2-Clause" }
authors = [{ name = "Liujiarong" }]
dependencies = [
  "pyyaml>=6.0",
  "onnxruntime>=1.17",
  "tokenizers>=0.15",
  "waitress>=3.0",
]

[project.optional-dependencies]
skill = [
  "packaging>=24.0",
  "jsonschema>=4.20",
]
inference = [
  "llama-cpp-python>=0.2.90",
]
cloud = [
  "httpx>=0.27",
]
dev = [
  "pytest>=7.4",
  "ruff>=0.4",
  "httpx>=0.27",
  "packaging>=24.0",
  "jsonschema>=4.20",
]
packaging = [
  "pyinstaller>=6.0",
]
webui = [
  "flask>=3.0",
  "waitress>=3.0",
]
desktop = [
  "pywebview>=5.0",
  "pystray>=0.19",
  "pillow>=10.0",
  "flask>=3.0",
  "waitress>=3.0",
]

[project.scripts]
companion = "offline_companion.shell.ui_host.cli:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["offline_companion*", "companion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "security: security-related tests",
  "linux_seccomp: Linux seccomp runtime validation tests",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
ignore = ["EXE001"]

[tool.ruff.lint.per-file-ignores]
"tests/test_runtime_sandbox.py" = ["S102"]
"src/offline_companion/core/plan_orchestrator.py" = ["BLE001"]
"src/offline_companion/core/state_manager.py" = ["BLE001"]
"src/offline_companion/runtime/inference_backend/backend.py" = ["BLE001"]
"src/offline_companion/shell/plan_auto_bridge.py" = ["BLE001", "S110"]
"src/offline_companion/shell/message_router.py" = ["BLE001"]
"src/offline_companion/shell/ui_host/cli.py" = ["BLE001"]
"src/offline_companion/shell/ui_host/conversation_orchestrator.py" = ["BLE001"]
"src/offline_companion/shell/ui_host/desktop/app.py" = ["BLE001", "S110"]
"src/offline_companion/shell/ui_host/desktop/http_host.py" = ["BLE001"]
